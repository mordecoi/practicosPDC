<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inicio Basico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="barraNav navbar navbar-light bg-light">
            <a class="navbar-brand" href="#">Pagina de Inicio Basica</a>
            <button class="btn btn-sm btn-outline-secondary" type="button">Seccion 1</button>
            <button class="btn btn-sm btn-outline-secondary" type="button">Seccion 2</button>
            <button class="btn btn-sm btn-outline-secondary" type="button">Seccion 3</button>
            <button class="btn btn-sm btn-outline-secondary" type="button">Seccion 4</button>
        </nav>
    </header>

    <main class="contPrincipal container my-3">
        <section class="encabezado text-center">
            <h1 class="tituloGrande display-1">PAGINA</h1>
            <a class="botonCTA btn btn-primary" href="">¡HAZ CLICK AQUI!</a>
        </section>
        <section class="tarjetas">
            <div class="row">
                <div class="col-md-4">
                    <article class="tarjeta card">
                        <img class="card-img-top" src="" alt="">
                        <div class="card-body">
                            <h4 class="tituloTarjeta card-title">titulo tarjeta 1</h4>
                            <p class="textoTarjeta card-text">texto interesante</p>
                            <button class="botonTarjeta btn btn-primary">Leer mas</button>
                        </div>
                    </article>
                </div>
                <div class="col-md-4">
                    <article class="tarjeta card">
                        <img class="card-img-top" alt="">
                        <div class="card-body">
                            <h4 class="tituloTarjeta card-title">titulo tarjeta 2</h4>
                            <p class="textoTarjeta card-text">texto asombroso</p>
                            <button class="botonTarjeta btn btn-primary">Leer mas</button>
                        </div>
                    </article>
                </div>
                <div class="col-md-4">
                    <article class="tarjeta card">
                        <img class="card-img-top" src="" alt="">
                        <div class="card-body">
                            <h4 class="tituloTarjeta card-title">titulo tarjeta 3</h4>
                            <p class="textoTarjeta card-text">texto terrible</p>
                            <button class="botonTarjeta btn btn-primary">Leer mas</button>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
