<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listado de compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<main class="container">
    <form>
        <div class="col-md-6 mb-2">
            <label class="form-label" for="nuevoArticulo">Ingrese el nombre de un articulo</label>
            <input class="form-control" type="text" placeholder="Escriba el nombre de un articulo" id="nuevoArticulo" required autofocus/>
        </div>
        <div class="col-md-6 mb-2">
            <button class="btn btn-primary" id="botonAgregar" aria-label="Agregar articulo a la lista">Añadir</button>
        </div>
    </form>
    <ul class="list-group" id="listaArticulos" aria-live="polite">
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>TextoPrueba</span>
            <div>
                <button class="btn btn-warning">Eliminar</button>
            </div>
        </li>
    </ul>
</main>
<script src="app.js"></script>
</body>
</html>
